---
# Packages (bluez) come in via the knowone-core meta.

# Booted system — dbus is available, so unlike phase 2 we can use the systemd
# module and start the service immediately instead of waiting for a reboot.
- name: "bluetooth: enable and start bluetooth.service"
  ansible.builtin.systemd:
    name: bluetooth.service
    enabled: true
    state: started
