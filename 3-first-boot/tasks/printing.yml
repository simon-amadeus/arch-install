---
- name: "printing: install CUPS and Avahi"
  ansible.builtin.package:
    name:
      - cups
      - avahi
      - nss-mdns
    state: present

- name: "printing: enable mDNS in nsswitch.conf for printer discovery"
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^hosts:'
    line: 'hosts: mymachines mdns_minimal [NOTFOUND=return] resolve [!UNAVAIL=return] files myhostname dns'

- name: "printing: enable and start cups.socket and avahi"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - cups.socket
    - avahi-daemon.service
