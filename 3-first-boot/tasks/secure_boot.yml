---
# Install sbctl, create Secure Boot keys, and sign the UKI. Runs on the booted system.
# Key enrollment into UEFI firmware follows immediately via secure_boot_enroll.yml.
# Pre-condition: UEFI must already be in Setup Mode before this task group runs.

- name: "secure_boot: install sbctl"
  ansible.builtin.package:
    name: sbctl
    state: present

- name: "secure_boot: check if keys already exist"
  ansible.builtin.stat:
    path: /usr/share/secureboot/keys/db/db.key
  register: sb_keys_stat

- name: "secure_boot: create Secure Boot keys"
  ansible.builtin.command: sbctl create-keys
  when: not sb_keys_stat.stat.exists
  changed_when: true

- name: "secure_boot: sign UKI and register for automatic re-signing"
  ansible.builtin.command: "sbctl sign -s /boot/EFI/Linux/arch-{{ kernel }}.efi"
  changed_when: true
  # sbctl ships zz-sbctl.hook which re-runs sign-all after kernel/bootloader updates.
