---
- name: "time: link /etc/localtime to selected zone"
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: "time: sync hardware clock from system clock"
  ansible.builtin.command: hwclock --systohc
  changed_when: true
