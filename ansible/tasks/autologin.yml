---
- name: "autologin: create getty override directory"
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: '0755'

- name: "autologin: write getty@tty1 autologin override"
  ansible.builtin.copy:
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    mode: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin {{ user.name }} %I $TERM
  register: autologin_override

- name: "autologin: reload systemd to apply override"
  ansible.builtin.systemd:
    daemon_reload: true
  when: autologin_override.changed
