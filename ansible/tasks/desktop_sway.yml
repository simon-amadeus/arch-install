---
- name: "desktop: install sway and wayland stack"
  ansible.builtin.package:
    name:
      # Compositor
      - sway
      - swaylock
      - swayidle
      # Status bar
      - waybar
      - ttf-font-awesome        # waybar icons
      # Launcher
      - wofi
      # Terminals
      - foot                 # sway default ($mod+Return) — works with no config
      - alacritty            # user-configured terminal (dotfiles)
      # Notifications
      - mako
      # Screenshots
      - grim
      - slurp
      # Clipboard
      - wl-clipboard
      # XDG portals (screen sharing, file picker)
      - xdg-desktop-portal-wlr
      - xdg-desktop-portal-gtk
      # User directories
      - xdg-user-dirs
      # Auth agent
      - polkit
      - polkit-gnome
      # Fonts
      - noto-fonts
      - noto-fonts-emoji
      - ttf-sourcecodepro-nerd  # terminal font with Nerd Font icons (lsd, starship)
      # Hardware controls
      - brightnessctl
      - playerctl
    state: present

# Drop-in keyboard layout for sway. The default /etc/sway/config (shipped by
# the Arch package) ends with `include /etc/sway/config.d/*`, so this applies
# before dotfiles are deployed. Once the user's ~/.config/sway/config exists
# (from dotfiles), it overrides /etc/sway/config entirely and takes over.
- name: "desktop: create /etc/sway/config.d directory"
  ansible.builtin.file:
    path: /etc/sway/config.d
    state: directory
    mode: '0755'

- name: "desktop: write keyboard layout drop-in for sway"
  ansible.builtin.copy:
    dest: /etc/sway/config.d/input.conf
    mode: '0644'
    content: |
      input type:keyboard {
          xkb_layout {{ xkb_layout }}
      }

# Written to /etc/profile.d/ so it's sourced by zsh on Arch via
# /etc/zsh/zprofile → /etc/profile → profile.d/. Does not touch user dotfiles.
- name: "desktop: write sway autostart to profile.d"
  ansible.builtin.copy:
    dest: /etc/profile.d/sway-autostart.sh
    mode: '0644'
    content: |
      if [ -z "${WAYLAND_DISPLAY}" ] && [ "${XDG_VTNR:-0}" = "1" ]; then
        exec sway
      fi

- name: "desktop: create XDG user directories for {{ user.name }}"
  ansible.builtin.command: xdg-user-dirs-update
  become_user: "{{ user.name }}"
  changed_when: false
  failed_when: false
  environment:
    HOME: "/home/{{ user.name }}"
    XDG_CONFIG_HOME: "/home/{{ user.name }}/.config"
