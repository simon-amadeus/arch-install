---
# Install user packages from dotfiles package lists.
# Files are written by sync-pkglist.service (pacman -Qqen / pacman -Qqem):
#   ~/.config/packages/pkglist.txt     — official-repo explicit packages
#   ~/.config/packages/aur_pkglist.txt — AUR/foreign explicit packages
# Both files are optional — a missing file is silently skipped.

- name: "packages: read official package list"
  ansible.builtin.slurp:
    src: "/home/{{ user.name }}/.config/packages/pkglist.txt"
  register: pkg_pacman_raw
  ignore_errors: true

- name: "packages: set pacman package list fact"
  ansible.builtin.set_fact:
    pacman_packages: >-
      {{
        pkg_pacman_raw['content']
        | b64decode
        | split
        | map('trim')
        | select
        | list
      }}
  when: pkg_pacman_raw is not failed

- name: "packages: install official packages"
  community.general.pacman:
    name: "{{ pacman_packages }}"
    state: present
  when: pacman_packages is defined and pacman_packages | length > 0

- name: "packages: read AUR package list"
  ansible.builtin.slurp:
    src: "/home/{{ user.name }}/.config/packages/aur_pkglist.txt"
  register: pkg_aur_raw
  ignore_errors: true

- name: "packages: set AUR package list fact"
  ansible.builtin.set_fact:
    aur_packages: >-
      {{
        pkg_aur_raw['content']
        | b64decode
        | split
        | map('trim')
        | select
        | list
      }}
  when: pkg_aur_raw is not failed

- name: "packages: install AUR packages via paru"
  ansible.builtin.command:
    argv: "{{ ['paru', '--noconfirm', '-S', '--needed', '--sudoflags', '-S'] + aur_packages }}"
    stdin: "{{ sudo_password }}\n"
  become_user: "{{ user.name }}"
  no_log: true
  when: aur_packages is defined and aur_packages | length > 0
  changed_when: true
