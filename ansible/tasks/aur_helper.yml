---
# Installs paru (AUR helper) as the primary user.
# Uses paru-bin (pre-compiled) to avoid a full Rust toolchain compile.
#
# Build and install are intentionally separated: makepkg runs as the user
# with -d (no dep-install) so it never calls sudo internally. The resulting
# package is then installed by Ansible as root, which already holds privilege.

- name: "aur: check if paru is installed"
  ansible.builtin.stat:
    path: /usr/bin/paru
  register: paru_stat

- name: "aur: create AUR build directory"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.cache/aur/paru-bin"
    state: directory
    mode: '0755'
  become_user: "{{ user.name }}"
  when: not paru_stat.stat.exists

- name: "aur: clone paru-bin from AUR"
  ansible.builtin.git:
    repo: https://aur.archlinux.org/paru-bin.git
    dest: "/home/{{ user.name }}/.cache/aur/paru-bin"
    force: true
  become_user: "{{ user.name }}"
  when: not paru_stat.stat.exists

- name: "aur: build paru-bin package"
  ansible.builtin.command:
    cmd: makepkg --noconfirm --noprogressbar --skippgpcheck -df
    chdir: "/home/{{ user.name }}/.cache/aur/paru-bin"
  become_user: "{{ user.name }}"
  when: not paru_stat.stat.exists
  changed_when: true

- name: "aur: find built package"
  ansible.builtin.find:
    paths: "/home/{{ user.name }}/.cache/aur/paru-bin"
    patterns: "*.pkg.tar.zst"
  register: paru_pkg
  when: not paru_stat.stat.exists

- name: "aur: install paru-bin with pacman"
  ansible.builtin.command:
    cmd: "pacman -U --noconfirm {{ paru_pkg.files[0].path }}"
  when: not paru_stat.stat.exists
  changed_when: true
