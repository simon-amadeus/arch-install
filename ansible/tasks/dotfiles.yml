---
- name: "dotfiles: install chezmoi"
  ansible.builtin.package:
    name: chezmoi
    state: present

# Ensure XDG base dirs are owned by the user before chezmoi runs.
# These can end up root-owned if any earlier task created them as root
# (e.g. aur_helper creating ~/.cache/aur/ before this fix was in place).
- name: "dotfiles: ensure XDG base dirs are owned by {{ user.name }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0700'
  loop:
    - "/home/{{ user.name }}/.cache"
    - "/home/{{ user.name }}/.config"
    - "/home/{{ user.name }}/.local"
    - "/home/{{ user.name }}/.local/share"

- name: "dotfiles: check if chezmoi repo is cloned"
  ansible.builtin.stat:
    path: "/home/{{ user.name }}/.local/share/chezmoi/.git"
  register: chezmoi_git

- name: "dotfiles: read current remote URL"
  ansible.builtin.command:
    cmd: "git -C /home/{{ user.name }}/.local/share/chezmoi remote get-url origin"
  register: chezmoi_remote
  changed_when: false
  failed_when: false
  when: chezmoi_git.stat.exists

# Re-init when the source dir is missing or the remote URL no longer matches.
- name: "dotfiles: init from {{ user.dotfiles_repo }}"
  ansible.builtin.command:
    cmd: "chezmoi init {{ user.dotfiles_repo }}"
  become_user: "{{ user.name }}"
  when: >
    not chezmoi_git.stat.exists or
    (chezmoi_remote.stdout | default('') | trim) != user.dotfiles_repo
  changed_when: true
  environment:
    HOME: "/home/{{ user.name }}"
    XDG_DATA_HOME: "/home/{{ user.name }}/.local/share"
    XDG_CONFIG_HOME: "/home/{{ user.name }}/.config"

- name: "dotfiles: apply"
  ansible.builtin.command:
    cmd: chezmoi apply --verbose
  become_user: "{{ user.name }}"
  register: chezmoi_apply
  changed_when: chezmoi_apply.stdout | length > 0
  environment:
    HOME: "/home/{{ user.name }}"
    XDG_DATA_HOME: "/home/{{ user.name }}/.local/share"
    XDG_CONFIG_HOME: "/home/{{ user.name }}/.config"

- name: "dotfiles: show apply output"
  ansible.builtin.debug:
    msg: "{{ (chezmoi_apply.stdout_lines + chezmoi_apply.stderr_lines) | select() | list }}"
  when: (chezmoi_apply.stdout_lines + chezmoi_apply.stderr_lines) | select() | list | length > 0
