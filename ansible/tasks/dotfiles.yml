---
- name: "dotfiles: clone bare repository"
  ansible.builtin.git:
    repo: "{{ user.dotfiles_repo }}"
    dest: "/home/{{ user.name }}/.dotfiles"
    bare: true
    update: true
  become_user: "{{ user.name }}"

- name: "dotfiles: checkout files into home directory"
  ansible.builtin.command:
    cmd: >
      git --git-dir=/home/{{ user.name }}/.dotfiles
          --work-tree=/home/{{ user.name }}/.config
          checkout -f
  become_user: "{{ user.name }}"
  changed_when: true

- name: "dotfiles: hide untracked files in git status"
  ansible.builtin.command:
    cmd: >
      git --git-dir=/home/{{ user.name }}/.dotfiles
          --work-tree=/home/{{ user.name }}/.config
          config --local status.showUntrackedFiles no
  become_user: "{{ user.name }}"
  changed_when: false
