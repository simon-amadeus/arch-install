---
- name: "network: ensure config dirs exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/iwd
    - /etc/systemd/network
    - /etc/systemd/resolved.conf.d

- name: "network: write iwd main.conf"
  ansible.builtin.copy:
    dest: /etc/iwd/main.conf
    mode: '0644'
    content: |
      [General]
      EnableNetworkConfiguration=true

      [Network]
      NameResolvingService=systemd

- name: "network: write systemd-networkd wireless profile"
  ansible.builtin.copy:
    dest: /etc/systemd/network/25-wireless.network
    mode: '0644'
    content: |
      [Match]
      Type=wlan

      [Network]
      DHCP=yes
      IPv6PrivacyExtensions=yes

      [DHCP]
      RouteMetric=20
      UseDNS=no

- name: "network: write resolved DNS config"
  ansible.builtin.template:
    src: install/resolved-dns.conf.j2
    dest: /etc/systemd/resolved.conf.d/dns.conf
    mode: '0644'

- name: "network: check if /etc/resolv.conf is a bind mount (arch-chroot context)"
  ansible.builtin.command: findmnt --noheadings /etc/resolv.conf
  register: resolv_bindmount
  changed_when: false
  failed_when: false

- name: "network: link /etc/resolv.conf to systemd-resolved stub"
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  when: resolv_bindmount.rc != 0
  # Skipped when running inside arch-chroot: the bootstrap handles this case by
  # creating the symlink directly on the mounted filesystem after the chroot exits.
