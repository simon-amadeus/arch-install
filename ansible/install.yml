---
# System-layer configuration — phase 2. Runs inside arch-chroot.
#
# Idempotent — every task is named so failures point at exactly which step
# died. Re-running after a fix only re-executes failed/changed tasks.
#
# Variables come from -e @hosts/<host>.yml passed by 2-install/install.sh.

- name: System configuration
  hosts: local
  gather_facts: true
  become: false   # we're already root inside the chroot

  vars:
    crypt_name: cryptroot
    luks_part_label: cryptsystem

  tasks:
    - name: Sanity-check required vars
      ansible.builtin.assert:
        that:
          - hostname is defined
          - timezone is defined
          - locale is defined
          - kernel is defined
          - user.name is defined
          - disk.device is defined
        fail_msg: "host config is missing required keys"

    - name: Resolve LUKS partition UUID by label
      ansible.builtin.command: blkid -s UUID -o value -t LABEL={{ luks_part_label }}
      register: luks_uuid_raw
      changed_when: false

    - name: Set luks_uuid fact
      ansible.builtin.set_fact:
        luks_uuid: "{{ luks_uuid_raw.stdout | trim }}"

    - name: Locale & console
      ansible.builtin.import_tasks: tasks/install/locale.yml
      tags: [locale]

    - name: Timezone & clock
      ansible.builtin.import_tasks: tasks/install/time.yml
      tags: [time]

    - name: Hostname & hosts file
      ansible.builtin.import_tasks: tasks/install/hostname.yml
      tags: [hostname]

    - name: Network (iwd + systemd-networkd + resolved)
      ansible.builtin.import_tasks: tasks/install/network.yml
      tags: [network]

    - name: DNS encryption (dnscrypt-proxy + Anonymized DNSCrypt)
      ansible.builtin.import_tasks: tasks/install/dns_crypt.yml
      tags: [dns]

    - name: mkinitcpio + Unified Kernel Image
      ansible.builtin.import_tasks: tasks/install/mkinitcpio.yml
      tags: [mkinitcpio]

    - name: systemd-boot
      ansible.builtin.import_tasks: tasks/install/bootloader.yml
      tags: [bootloader]

    - name: User account
      ansible.builtin.import_tasks: tasks/install/users.yml
      tags: [users]

    - name: Stage install scripts in user home
      ansible.builtin.import_tasks: tasks/install/stage_scripts.yml
      tags: [stage]

    - name: CLI tools (bat, lsd, helix, starship, …)
      ansible.builtin.import_tasks: tasks/install/cli_tools.yml
      tags: [cli]

    - name: Default zsh config (overwritten by dotfiles in setup phase)
      ansible.builtin.import_tasks: tasks/install/zsh_defaults.yml
      tags: [zsh]
      when: user.shell | default('') == '/bin/zsh'

    - name: Enable essential services
      ansible.builtin.import_tasks: tasks/install/services.yml
      tags: [services]

    - name: Bluetooth
      ansible.builtin.import_tasks: tasks/install/bluetooth.yml
      tags: [bluetooth]
      when: features.bluetooth | default(false)

    - name: Firewall (firewalld)
      ansible.builtin.import_tasks: tasks/install/firewall.yml
      tags: [firewall]
      when: features.firewalld | default(false)

    - name: Printing (CUPS + Avahi)
      ansible.builtin.import_tasks: tasks/install/printing.yml
      tags: [printing]
      when: features.printing | default(false)

    - name: Autologin on tty1
      ansible.builtin.import_tasks: tasks/install/autologin.yml
      tags: [autologin]
      when: features.desktop | default('none') != 'none'

    - name: Btrfs snapshots (snapper + snap-pac)
      ansible.builtin.import_tasks: tasks/install/snapshots.yml
      tags: [snapshots]
      when: features.snapshots | default(false)

