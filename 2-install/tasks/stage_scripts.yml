---
# Makes the install repo available in the user's home on the booted system.
# /root/install is staged by the bootstrap before the Ansible run; this task
# copies it to ~/arch-install so the user can run 3-first-boot/first-boot.sh
# immediately after first boot without manually cloning.

- name: "stage_scripts: copy install repo to user home"
  ansible.builtin.command:
    cmd: "cp -a /root/install /home/{{ user.name }}/arch-install"
    creates: "/home/{{ user.name }}/arch-install"

- name: "stage_scripts: fix ownership"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/arch-install"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true
    state: directory
