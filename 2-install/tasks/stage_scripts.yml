---
# Makes the install repo available in the user's home on the booted system.
# /root/install is staged by the bootstrap before the Ansible run; this task
# syncs it to ~/arch-install so the user can run 3-first-boot/first-boot.sh
# immediately after first boot without manually cloning. rsync (part of the
# base package set) keeps the copy fresh on recover.sh re-runs.

- name: "stage_scripts: sync install repo to user home"
  ansible.builtin.command:
    cmd: "rsync -ai --delete /root/install/ /home/{{ user.name }}/arch-install/"
  register: stage_sync
  changed_when: stage_sync.stdout | length > 0

- name: "stage_scripts: fix ownership"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/arch-install"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    recurse: true
    state: directory
