---
- name: "autologin: install wrapper script"
  ansible.builtin.template:
    src: agetty-autologin.j2
    dest: /usr/local/bin/agetty-autologin
    owner: root
    group: root
    mode: '0755'

- name: "autologin: create getty override directory"
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: '0755'

- name: "autologin: write getty@tty1 autologin override"
  ansible.builtin.copy:
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    mode: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart=-/usr/local/bin/agetty-autologin %I $TERM
# No daemon_reload: the chroot has no running PID 1. systemd picks up the
# drop-in on first boot.
