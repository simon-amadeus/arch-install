---
# Writes a minimal ~/.zshrc that wires up the installed zsh plugins and
# starship. Runs during the install phase so the shell is functional on first
# boot. The setup phase's dotfiles task overwrites this with the user's own
# ~/.zshrc if dotfiles are configured.

- name: "zsh_defaults: write default ~/.zshrc"
  ansible.builtin.copy:
    dest: "/home/{{ user.name }}/.zshrc"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0644'
    content: |
      source /usr/share/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh
      source /usr/share/zsh/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
      eval "$(starship init zsh)"
