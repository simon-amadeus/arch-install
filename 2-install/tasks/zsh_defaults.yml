---
# Writes an empty ~/.zshrc during install. Plugins and starship are not
# installed until phase 3, so sourcing them here would produce errors on
# first boot. Phase 3's zsh_defaults task writes the real default once the
# packages are present. Phase 4's dotfiles task overwrites it with the
# user's own ~/.zshrc if dotfiles are configured.

- name: "zsh_defaults: write empty ~/.zshrc"
  ansible.builtin.copy:
    dest: "/home/{{ user.name }}/.zshrc"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: '0644'
    content: ""
