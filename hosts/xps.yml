---
# Host configuration for the Dell XPS.
# This is the single source of truth for the install — bootstrap reads it,
# Ansible reads it. No prompts at install time except the disk passphrase.

hostname: xps
reflector_country: Germany

# Locale & console
keymap: de-latin1          # Linux virtual console (kbd keymap name)
xkb_layout: de             # Wayland/XKB layout — separate system, different names
console_font: ter-132b
timezone: Europe/Berlin
locale: en_US.UTF-8
additional_locales:
  - de_DE.UTF-8
locale_overrides:
  LC_TIME: de_DE.UTF-8
  LC_NUMERIC: de_DE.UTF-8
  LC_MONETARY: de_DE.UTF-8
  LC_PAPER: de_DE.UTF-8
  LC_MEASUREMENT: de_DE.UTF-8

# Disk layout
# - One LUKS2 container holds btrfs with subvolumes
# - Swap lives as a btrfs swapfile inside the encrypted volume
disk:
  device: /dev/nvme0n1
  esp_size: 1GiB           # bumped from 512MiB so UKIs fit comfortably
  swapfile_size: 16G       # GiB, btrfs swapfile inside @swap subvolume

# Kernel & microcode
kernel: linux-zen
microcode: intel-ucode

# User account created during install
user:
  name: knowone
  shell: /bin/zsh
  groups:
    - wheel
  dotfiles_repo: https://github.com/simon-amadeus/dotfiles.git

# Optional features. Each maps to an Ansible task that's skipped when false.
features:
  audio: true              # pipewire stack
  bluetooth: true
  printing: true
  firewalld: true
  usb_automount: true
  desktop: sway            # one of: none, minimal, sway
  snapshots: true          # snapper + snap-pac btrfs snapshot automation
  secure_boot: false       # set true once UEFI is in Setup Mode for enrollment
  dotfiles: true           # set true after dotfiles repo is reviewed and restructured
  packages: true           # install user packages from the dotfiles repo's package lists

# DNS is handled by dnscrypt-proxy with Anonymized DNSCrypt.
# systemd-resolved forwards to 127.0.0.2; no upstream IPs needed here.
