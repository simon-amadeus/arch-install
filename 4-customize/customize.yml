---
# Personal environment — phase 4. Runs after first-boot setup.
# Installs the desktop environment, personal dotfiles, and user packages.
#
# Usage:
#   ./4-customize/customize.sh <hostname>

- name: Personal environment
  hosts: local
  gather_facts: true
  become: true   # sudo password is supplied via ansible-playbook -K

  vars_files:
    - ../packages.yml

  tasks:
    - name: Sanity-check required vars
      ansible.builtin.assert:
        that:
          - user.name is defined
          - features is defined
        fail_msg: "host config is missing required keys"

    - name: AUR helper (paru)
      ansible.builtin.import_tasks: tasks/aur_helper.yml
      tags: [aur]

    - name: Meta-package knowone-desktop (sway stack)
      ansible.builtin.import_tasks: ../meta/install_meta.yml
      tags: [desktop]
      when: features.desktop | default('none') == 'sway'
      vars:
        meta_name: knowone-desktop
        meta_depends: "{{ package_groups.desktop_sway | unique | sort }}"

    - name: Desktop (sway)
      ansible.builtin.import_tasks: tasks/desktop_sway.yml
      tags: [desktop]
      when: features.desktop | default('none') == 'sway'

    - name: Dotfiles (bare git)
      ansible.builtin.import_tasks: tasks/dotfiles.yml
      tags: [dotfiles]
      when: user.dotfiles_repo is defined and features.dotfiles | default(false)

    - name: User packages (official repos only — AUR is aur-install.sh)
      ansible.builtin.import_tasks: tasks/packages.yml
      tags: [packages]
      when: features.packages | default(false)
