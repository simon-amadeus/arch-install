---
# Install user packages from the dotfiles manifest. Only official-repo
# packages are handled here — AUR is interactive and lives in aur-install.sh,
# which the customize.sh wrapper invokes after this playbook completes.
#
# ~/.config/packages/pkglist.txt is a hand-curated manifest (one package
# per line) of what the user installed on top of arch-install's metas.
# It is never auto-generated; the dotfiles pkg-drift timer reports any
# divergence between the manifest and the actually installed packages.
# Missing file is silently skipped.

- name: "packages: read official package list"
  ansible.builtin.slurp:
    src: "/home/{{ user.name }}/.config/packages/pkglist.txt"
  register: pkg_pacman_raw
  ignore_errors: true

- name: "packages: set pacman package list fact"
  ansible.builtin.set_fact:
    pacman_packages: >-
      {{
        pkg_pacman_raw['content']
        | b64decode
        | split
        | map('trim')
        | select
        | list
      }}
  when: pkg_pacman_raw is not failed

- name: "packages: install official packages"
  community.general.pacman:
    name: "{{ pacman_packages }}"
    state: present
  when: pacman_packages is defined and pacman_packages | length > 0
