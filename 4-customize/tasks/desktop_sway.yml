---
# Packages (the sway/wayland stack) come in via the knowone-desktop meta —
# see packages.yml at the repo root.

# Drop-in keyboard layout for sway. The default /etc/sway/config (shipped by
# the Arch package) ends with `include /etc/sway/config.d/*`, so this applies
# before dotfiles are deployed. Once the user's ~/.config/sway/config exists
# (from dotfiles), it overrides /etc/sway/config entirely and takes over.
- name: "desktop: create /etc/sway/config.d directory"
  ansible.builtin.file:
    path: /etc/sway/config.d
    state: directory
    mode: '0755'

- name: "desktop: write keyboard layout drop-in for sway"
  ansible.builtin.copy:
    dest: /etc/sway/config.d/input.conf
    mode: '0644'
    content: |
      input type:keyboard {
          xkb_layout {{ xkb_layout }}
      }

- name: "desktop: create XDG user directories for {{ user.name }}"
  ansible.builtin.command: xdg-user-dirs-update
  become_user: "{{ user.name }}"
  changed_when: false
  failed_when: false
  environment:
    HOME: "/home/{{ user.name }}"
    XDG_CONFIG_HOME: "/home/{{ user.name }}/.config"
