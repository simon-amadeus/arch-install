---
- name: "dotfiles: clone bare repository"
  ansible.builtin.git:
    repo: "{{ user.dotfiles_repo }}"
    dest: "/home/{{ user.name }}/.dotfiles"
    bare: true
    update: true
  become_user: "{{ user.name }}"

- name: "dotfiles: checkout files into home directory"
  ansible.builtin.command:
    cmd: >
      git --git-dir=/home/{{ user.name }}/.dotfiles
          --work-tree=/home/{{ user.name }}
          checkout -f
  become_user: "{{ user.name }}"
  changed_when: true
  # work-tree is ~ (not ~/.config): repo paths are relative to home root,
  # e.g. .config/nvim/init.lua → ~/.config/nvim/init.lua.

- name: "dotfiles: hide untracked files in git status"
  ansible.builtin.command:
    cmd: >
      git --git-dir=/home/{{ user.name }}/.dotfiles
          --work-tree=/home/{{ user.name }}
          config --local status.showUntrackedFiles no
  become_user: "{{ user.name }}"
  changed_when: false

- name: "dotfiles: create systemd user timers.target.wants directory"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/systemd/user/timers.target.wants"
    state: directory
    mode: '0755'
    owner: "{{ user.name }}"
    group: "{{ user.name }}"

- name: "dotfiles: enable pkg-drift timer"
  ansible.builtin.file:
    src: "/home/{{ user.name }}/.config/systemd/user/pkg-drift.timer"
    dest: "/home/{{ user.name }}/.config/systemd/user/timers.target.wants/pkg-drift.timer"
    state: link
    owner: "{{ user.name }}"
    group: "{{ user.name }}"

- name: "dotfiles: remove old sync-pkglist timer link"
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/systemd/user/timers.target.wants/sync-pkglist.timer"
    state: absent
